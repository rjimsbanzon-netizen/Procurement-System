        async function cloudRequest(path, options = {}, token = localStorage.getItem(CLOUD_TOKEN_KEY)) {
            const response = await fetch(`${CLOUD_API_BASE}${path}`, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    ...(token ? { Authorization: `Bearer ${token}` } : {}),
                    ...(options.headers || {})
                }
            });
            let body = {};
            try {
                body = await response.json();
            } catch (error) {
                if (response.ok) throw new Error('Cloud API returned an invalid response.');
            }
            if (!response.ok) {
                if (response.status === 401 && token === localStorage.getItem(CLOUD_TOKEN_KEY)) {
                    localStorage.removeItem(CLOUD_TOKEN_KEY);
                    localStorage.removeItem(CLOUD_USERNAME_KEY);
                }
                throw new Error(body.error || `Cloud API request failed (${response.status}).`);
            }
            return body;
        }

        // Storage Controller
        class Storage {
            static empty() {
                return {
                    ...INITIAL_STATE,
                    currentUser: null,
                    permissions: Object.fromEntries(
                        Object.entries(INITIAL_STATE.permissions).map(([role, permissions]) => [role, [...permissions]])
                    ),
                    users: [],
                    stockNeeds: [],
                    bids: [],
                    proposalMeetings: [],
                    requisitions: [],
                    orders: [],
                    deliveries: [],
                    amendments: [],
                    payments: [],
                    suppliers: [],
                    ratings: [],
                    auditLogs: [],
                    accessControl: [],
                    nonAdminUsersPruned: true
                };
            }

            static get() {
                const data = localStorage.getItem('eprocurement_db');
                if (!data) {
                    localStorage.setItem('eprocurement_db', JSON.stringify(INITIAL_STATE));
                    return INITIAL_STATE;
                }
                try {
                    const parsed = JSON.parse(data);
                    // Ensure permissions fallback if upgraded
                    if (!parsed.permissions) parsed.permissions = INITIAL_STATE.permissions;
                    if (!parsed.ratings) parsed.ratings = INITIAL_STATE.ratings;
                    if (!parsed.stockNeeds) parsed.stockNeeds = INITIAL_STATE.stockNeeds;
                    if (!parsed.bids) parsed.bids = INITIAL_STATE.bids;
                    if (!parsed.proposalMeetings) parsed.proposalMeetings = INITIAL_STATE.proposalMeetings;
                    if (!parsed.nonAdminUsersPruned) {
                        const originalUserCount = Array.isArray(parsed.users) ? parsed.users.length : 0;
                        parsed.users = (Array.isArray(parsed.users) ? parsed.users : [])
                            .filter(user => user.role === 'Admin');
                        if (parsed.currentUser && parsed.currentUser.role !== 'Admin') {
                            parsed.currentUser = null;
                        }
                        parsed.nonAdminUsersPruned = true;
                        if (parsed.users.length < originalUserCount) {
                            parsed.auditLogs = Array.isArray(parsed.auditLogs) ? parsed.auditLogs : [];
                            parsed.auditLogs.unshift({
                                id: 'log-' + Date.now(),
                                timestamp: new Date().toISOString().replace('T', ' ').substring(0, 16),
                                user: 'System',
                                role: 'System',
                                action: 'Non-admin Accounts Removed',
                                details: 'One-time account cleanup removed all non-admin enterprise user accounts.'
                            });
                        }
                        localStorage.setItem('eprocurement_db', JSON.stringify(parsed));
                    }
                    Object.keys(parsed.permissions).forEach(role => {
                        const rolePermissions = parsed.permissions[role];
                        if (rolePermissions.includes('issue_po') && !rolePermissions.includes('manage_suppliers')) {
                            rolePermissions.push('manage_suppliers');
                        }
                    });
                    return parsed;
                } catch(e) {
                    return INITIAL_STATE;
                }
            }

            static save(state) {
                localStorage.setItem('eprocurement_db', JSON.stringify(state));
                const token = CLOUD_API_BASE ? localStorage.getItem(CLOUD_TOKEN_KEY) : null;
                if (!token) return;

                const data = Object.fromEntries(
                    CLOUD_RECORD_COLLECTIONS.map(collection => [collection, state[collection]])
                );
                cloudSaveQueue = cloudSaveQueue.then(async () => {
                    await cloudRequest('/enterprise-state', {
                        method: 'PUT',
                        body: JSON.stringify({ data })
                    }, token);
                    cloudSaveError = null;
                }).catch(error => {
                    cloudSaveError = error;
                    console.error('Enterprise data could not be saved to Cloudflare D1.', error);
                    showToast('Cloud save failed. Your latest changes are not confirmed in D1.', 'error');
                });
            }

            static async flush() {
                await cloudSaveQueue;
                if (cloudSaveError) {
                    const error = cloudSaveError;
                    cloudSaveError = null;
                    throw error;
                }
            }

            static async reset() {
                const freshState = Storage.empty();
                freshState.users = (DB.users || []).filter(user => user.role === 'Admin');
                freshState.currentUser = DB.currentUser?.role === 'Admin' ? DB.currentUser : null;
                DB = freshState;
                Storage.save(DB);
                try {
                    await Storage.flush();
                } catch {
                    return;
                }
                location.reload();
            }
        }

        function showToast(message, type = 'info') {

            toast.className = `pointer-events-auto flex items-center p-4 max-w-xs w-full rounded-lg shadow-lg text-white transition-all duration-300 transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-emerald-600' :
                type === 'error' ? 'bg-rose-600' :
                type === 'warning' ? 'bg-amber-500' : 'bg-sky-600'
            }`;
            
            const icon = type === 'success' ? 'fa-check-circle' :
                         type === 'error' ? 'fa-exclamation-circle' :
                         type === 'warning' ? 'fa-triangle-exclamation' : 'fa-info-circle';

            toast.innerHTML = `
                <i class="fa-solid ${icon} text-lg mr-3"></i>
                <div class="text-sm font-medium flex-1">${message}</div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');

        function mapCloudUser(user, suppliers = []) {
            if (!user) throw new Error('Cloud account details are missing.');
            const role = user.app_role || (user.role === 'admin' ? 'Admin' : user.role === 'guest' ? 'Supplier' : 'Employee');
            const supplier = role === 'Supplier'
                ? suppliers.find(item => item.name.toLowerCase() === (user.company_name || '').toLowerCase())
                : null;
            return {
                id: user.id,
                username: user.username,
                name: user.name,
                email: user.email,
                role,
                department: role === 'Admin' ? 'Executive' : role === 'Supplier' ? (user.company_name || 'External Vendor') : (user.department || 'Unassigned'),
                companyName: user.company_name || '',
                accessRevoked: Boolean(user.access_revoked),
                status: user.access_revoked ? 'Access Revoked' : user.status === 'pending' ? 'Pending Verification' : user.status === 'rejected' ? 'Rejected' : 'Active',
                supplierId: supplier?.id ?? null
            };
        }

        function applyCloudState(data, user, users = [user], accessControl = null) {
            const state = Storage.empty();
            if (data !== null) {
                if (!data || typeof data !== 'object' || Array.isArray(data)) {
                    throw new Error('Cloud business data has an invalid format.');
                }
                CLOUD_RECORD_COLLECTIONS.forEach(collection => {
                    if (!Array.isArray(data[collection])) {
                        throw new Error(`Cloud business data is missing ${collection}.`);
                    }
                    state[collection] = data[collection];
                });
            }
            if (accessControl?.permissions && typeof accessControl.permissions === 'object') {
                Object.keys(state.permissions).forEach(role => {
                    const permissions = accessControl.permissions[role];
                    if (Array.isArray(permissions)) {
                        state.permissions[role] = permissions.filter(permission => typeof permission === 'string');
                    }
                });
            }
            state.users = users.map(account => mapCloudUser(account, state.suppliers));
            state.currentUser = user;
            DB = state;
        }

        async function restoreCloudSession() {
            const token = localStorage.getItem(CLOUD_TOKEN_KEY);
            if (!token) {
                localStorage.removeItem(CLOUD_TOKEN_KEY);
                localStorage.removeItem(CLOUD_USERNAME_KEY);
                renderApp();
                return;
            }

            try {
                const [session, snapshot, accessControl] = await Promise.all([
                    cloudRequest('/auth/me'),
                    cloudRequest('/enterprise-state'),
                    cloudRequest('/access-control')
                ]);
                const account = session.user;
                const user = mapCloudUser(account, snapshot.data?.suppliers || []);
                const users = account.role === 'admin' ? await cloudRequest('/users') : [account];
                applyCloudState(snapshot.data, user, users, accessControl);
                renderApp();
            } catch (error) {
                localStorage.removeItem(CLOUD_TOKEN_KEY);
                localStorage.removeItem(CLOUD_USERNAME_KEY);
                DB = Storage.empty();
                console.error('Cloud session could not be restored.', error);
                showToast('Cloud session could not be restored. Please sign in again.', 'warning');
                renderApp();
            }
        }

        async function signInToCloud(username, password) {
            const response = await cloudRequest('/auth/login', {
                method: 'POST',
                body: JSON.stringify({ username, password })
            }, null);
            if (response.pending) {
                throw new Error('Your registration is awaiting administrator verification.');
            }
            if (response.rejected) {
                throw new Error('This account was rejected. Choose Register Account and resubmit using the same username, email, and password.');
            }
            if (response.accessRevoked) {
                throw new Error('Access to this account has been revoked. Contact an administrator.');
            }
            if (!response.user || !response.token) {
                throw new Error('Invalid username or password.');
            }

            try {
                const [snapshot, accessControl] = await Promise.all([
                    cloudRequest('/enterprise-state', {}, response.token),
                    cloudRequest('/access-control', {}, response.token)
                ]);
                const user = mapCloudUser(response.user, snapshot.data?.suppliers || []);
                const users = user.role === 'Admin'
                    ? await cloudRequest('/users', {}, response.token)
                    : [response.user];
                localStorage.setItem(CLOUD_TOKEN_KEY, response.token);
                localStorage.setItem(CLOUD_USERNAME_KEY, user.username);
                applyCloudState(snapshot.data, user, users, accessControl);
            } catch (error) {
                localStorage.removeItem(CLOUD_TOKEN_KEY);
                localStorage.removeItem(CLOUD_USERNAME_KEY);
                throw error;
            }

            const user = DB.currentUser;
            logAudit('User Login', `User ${user.name} signed in successfully.`);
            showToast(`Welcome back, ${user.name}!`, 'success');
            renderApp();
        }

            const response = await cloudRequest('/auth/register', {

            showToast(

                    ? 'Your registration has been resubmitted for administrator review.'
                    : 'Registration submitted. An administrator must verify your account before you can sign in.',
                'success'
            );
            window.authMode = 'login';
            renderApp();

        function hasPermission(action) {
            if (!DB.currentUser) return false;
            const role = DB.currentUser.role;
            const userPerms = DB.permissions[role] || [];
            return userPerms.includes(action);
        }

        function canAccessTab(tab) {
            if (!DB.currentUser) return false;
            const isSupplier = DB.currentUser.role === 'Supplier';
            switch (tab) {
                case 'dashboard': return !isSupplier || hasPermission('view_supplier_portal');
                case 'bidding': return isSupplier ? hasPermission('submit_bids') : canManageBidding();
                case 'requisitions': return hasPermission('create_pr') || hasPermission('approve_pr');
                case 'orders': return hasPermission(isSupplier ? 'view_assigned_po' : 'view_all_po');
                case 'delivery':
                    return isSupplier
                        ? hasPermission('view_assigned_po')
                        : hasPermission('record_delivery') || canManageDeliveryIssues();
                case 'amendments':
                    return isSupplier
                        ? hasPermission('view_assigned_po')
                        : canManageDeliveryIssues() || canApproveAmendments();
                case 'payments':
                    return isSupplier
                        ? hasPermission('view_assigned_po')
                        : hasPermission('process_payment') || hasPermission('confirm_payment');
                case 'suppliers': return hasPermission('manage_suppliers') || hasPermission('rate_supplier');
                case 'audit': return DB.currentUser.role === 'Admin';
                case 'users': return DB.currentUser.role === 'Admin' && hasPermission('manage_users');
                case 'access_control':
                    return DB.currentUser.role === 'Admin' && hasPermission('manage_permissions');
                default: return false;
            }
        }

        function canManageBidding() {
            return ['Admin', 'Procurement Head'].includes(DB.currentUser?.role) && hasPermission('manage_bidding');
        }

        function canManageDeliveryIssues() {
            return ['Admin', 'Procurement Head'].includes(DB.currentUser?.role) &&
                hasPermission('manage_delivery_issues');
        }

        function canApproveAmendments() {
            return ['Admin', 'Procurement Head'].includes(DB.currentUser?.role) &&
                hasPermission('approve_amendment');
        }

        function getAvailableRequisitions() {
            return DB.requisitions.filter(pr =>
                pr.status === 'Approved' &&
                !DB.stockNeeds.some(need => need.prId === pr.id) &&
                !DB.orders.some(order => order.prId === pr.id)
            );
        }

        function isOrderFullyVerified(poId) {
            const order = DB.orders.find(item => item.id === poId);
            const deliveries = DB.deliveries.filter(item => item.poId === poId);
            return Boolean(order && deliveries.length > 0) &&
                deliveries.every(item => item.complianceStatus === 'Completed - Verified') &&
                deliveries.reduce((total, item) => total + Number(item.deliveredQty || 0), 0) >= order.quantity;
        }

        function getRemainingOrderQuantity(poId) {
            const order = DB.orders.find(item => item.id === poId);
            if (!order) return 0;
            const delivered = DB.deliveries
                .filter(item => item.poId === poId)
                .reduce((total, item) => total + Number(item.deliveredQty || 0), 0);
            return Math.max(0, order.quantity - delivered);
        }

        // Helper: Calculate average rating for a supplier
        function getSupplierRatingStats(supplierId) {
            const supplierRatings = DB.ratings.filter(r => r.supplierId === supplierId);
            if (supplierRatings.length === 0) return { avg: 0, count: 0 };
            
            const sum = supplierRatings.reduce((acc, curr) => acc + curr.rating, 0);
            const avg = (sum / supplierRatings.length).toFixed(1);
            return { avg: parseFloat(avg), count: supplierRatings.length };
        }

        function attachAuthEvents() {
            const toggleBtn = document.getElementById('toggle-auth');

                    e.preventDefault();
                    window.authMode = window.authMode === 'signup' ? 'login' : 'signup';
                    renderApp();
                });
            }

            const accountTypeSelect = document.getElementById('auth-account-type');
            if (accountTypeSelect) {
                accountTypeSelect.addEventListener('change', (e) => {
                    const type = e.target.value;
                    const deptContainer = document.getElementById('dept-field-container');
                    const supplierSelectContainer = document.getElementById('supplier-select-container');
                    const companyContainer = document.getElementById('cloud-supplier-company-container');
                    const companyInput = document.getElementById('auth-supplier-company');
                    
                    if (type === 'Supplier') {
                        deptContainer.classList.add('hidden');
                        if (CLOUD_API_BASE) {
                            supplierSelectContainer.classList.add('hidden');
                            companyContainer?.classList.remove('hidden');
                            if (companyInput) companyInput.required = true;
                        } else {
                            supplierSelectContainer.classList.remove('hidden');
                        }
                    } else {
                        deptContainer.classList.remove('hidden');
                        supplierSelectContainer.classList.add('hidden');
                        document.getElementById('new-supplier-name-container')?.classList.add('hidden');
                        companyContainer?.classList.add('hidden');
                        if (companyInput) companyInput.required = false;
                    }
                });
            }

            const supplierIdSelect = document.getElementById('auth-supplier-id');
            if (supplierIdSelect) {
                supplierIdSelect.addEventListener('change', (e) => {
                    const newSupContainer = document.getElementById('new-supplier-name-container');
                    if (e.target.value === 'NEW_SUPPLIER') {
                        newSupContainer.classList.remove('hidden');

                        newSupContainer.classList.add('hidden');

                });

            if (form) {

                    e.preventDefault();
                    const username = document.getElementById('auth-username').value.trim();
                    const password = document.getElementById('auth-password').value;

                    if (CLOUD_API_BASE && window.authMode === 'signup') {
                        try {
                            await registerCloudAccount({
                                username,
                                password,
                                name: document.getElementById('auth-name').value.trim(),
                                email: document.getElementById('auth-email').value.trim(),
                                accountType: document.getElementById('auth-account-type').value === 'Supplier' ? 'supplier' : 'employee',

                                companyName: document.getElementById('auth-supplier-company')?.value.trim() || ''
                            });
                        } catch (error) {
                            showToast(error instanceof Error ? error.message : 'Cloud registration failed.', 'error');
                        }
                        return;
                    }

                    if (CLOUD_API_BASE) {
                        try {
                            await signInToCloud(username, password);
                        } catch (error) {
                            showToast(error instanceof Error ? error.message : 'Cloud sign-in failed.', 'error');
                        }
                        return;
                    }

                    if (window.authMode === 'signup') {
                        const name = document.getElementById('auth-name').value.trim();
                        const email = document.getElementById('auth-email').value.trim();
                        const accountType = document.getElementById('auth-account-type').value;

                        if (DB.users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
                            showToast('Username already taken.', 'error');
                            return;
                        }

                        let assignedSupplierId = null;
                        let dept = 'External Vendor';

                        if (accountType === 'Supplier') {
                            const supSelectVal = document.getElementById('auth-supplier-id').value;
                            if (supSelectVal === 'NEW_SUPPLIER') {
                                const newSupName = document.getElementById('auth-new-supplier-name').value.trim();
                                if (!newSupName) {
                                    showToast('Please specify company name.', 'error');
                                    return;
                                }
                                assignedSupplierId = 'sup-' + Date.now();
                                DB.suppliers.push({
                                    id: assignedSupplierId,
                                    name: newSupName,
                                    contact: name,
                                    email: email,
                                    phone: 'Pending',
                                    category: 'General Supplier'
                                });
                            } else {
                                assignedSupplierId = supSelectVal;
                            }
                        } else {
                            dept = document.getElementById('auth-dept').value;
                        }

                        const newUser = {
                            id: 'usr-' + Date.now(),
                            username,
                            password,
                            name,
                            email,
                            department: dept,
                            role: accountType === 'Supplier' ? 'Supplier' : 'Employee',
                            supplierId: assignedSupplierId,
                            status: 'Pending Verification'
                        };

                        DB.users.push(newUser);
                        logAudit('User Registration', `Account creation requested for ${name} (${username}). Role: ${newUser.role}`);
                        Storage.save(DB);

                        showToast('Registration submitted! Awaiting administrator approval.', 'success');
                        window.authMode = 'login';
                        renderApp();
                    } else {
                        const user = DB.users.find(u => u.username === username && u.password === password);
                        if (!user) {
                            showToast('Invalid credentials provided.', 'error');
                            return;
                        }

                        if (user.status === 'Pending Verification') {
                            showToast('Your account is awaiting Admin authorization.', 'warning');
                            return;
                        }

                        DB.currentUser = user;
                        logAudit('User Login', `User ${user.name} signed in successfully.`);
                        Storage.save(DB);
                        showToast(`Welcome back, ${user.name}!`, 'success');
                        renderApp();
                    }
                });
            }

            switch(status) {
                case 'Pending':

                case 'Approved':
                    return `<span class="px-2.5 py-1 bg-emerald-100 text-emerald-800 rounded-full text-xs font-semibold inline-flex items-center"><i class="fa-solid fa-circle-check mr-1"></i> Approved</span>`;
                case 'In Process':
                    return `<span class="px-2.5 py-1 bg-blue-100 text-blue-800 rounded-full text-xs font-semibold inline-flex items-center"><i class="fa-solid fa-spinner fa-spin mr-1"></i> In Process</span>`;
                case 'Rejected':
                    return `<span class="px-2.5 py-1 bg-rose-100 text-rose-800 rounded-full text-xs font-semibold inline-flex items-center"><i class="fa-solid fa-circle-xmark mr-1"></i> Rejected</span>`;
                default:
                    return `<span class="px-2.5 py-1 bg-slate-100 text-slate-800 rounded-full text-xs font-semibold">${status}</span>`;
            }
        }

                                        ${supplierRatings.length > 0 ? `

                                                <div class="font-semibold text-slate-700 flex justify-between">
                                                    <span>${supplierRatings[0].evaluatorName}</span>
                                                    <span class="text-amber-500"><i class="fa-solid fa-star"></i> ${supplierRatings[0].rating}/5</span>
                                                </div>
                                                <p class="text-slate-500 italic mt-1 truncate">"${supplierRatings[0].feedback}"</p>
                                            </div>
                                        ` : `
                                            <div class="mt-4 p-2.5 bg-slate-50 rounded-lg text-xs text-slate-400 text-center italic">
                                                No ratings recorded yet.
                                            </div>
                                        `}
                                    </div>

                                    <div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                                        <button onclick="viewSupplierRatingsModal('${s.id}')" class="text-xs text-sky-600 hover:text-sky-800 font-semibold">
                                            <i class="fa-solid fa-comments mr-1"></i> ${stats.count} Reviews
                                        </button>

                                        ${hasPermission('rate_supplier') ? `
                                            <div class="flex flex-col items-end gap-1">
                                                ${DB.payments.filter(payment =>
                                                    payment.status === 'Paid' &&

                                                    isOrderFullyVerified(payment.poId) &&

                                                ).map(payment => `
                                                    <button onclick="openRateSupplierModal('${s.id}', '${payment.poId}')" class="px-3 py-1.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-semibold shadow-sm transition-colors">

                    </div>

        function renderStarRatingHTML(score) {
            let html = '';
            const numeric = parseFloat(score) || 0;
            for (let i = 1; i <= 5; i++) {
                if (i <= Math.floor(numeric)) {
                    html += `<i class="fa-solid fa-star text-amber-400 text-xs"></i>`;
                } else if (i - 0.5 <= numeric) {
                    html += `<i class="fa-solid fa-star-half-stroke text-amber-400 text-xs"></i>`;
                } else {
                    html += `<i class="fa-regular fa-star text-slate-300 text-xs"></i>`;
                }
            }
            return html;
        }

        function openRecordDeliveryModal(poId) {
            const order = DB.orders.find(item => item.id === poId);
            if (!hasPermission('record_delivery') || !order ||
                !['Approved & Signed', 'Issued'].includes(order.status) ||
                getRemainingOrderQuantity(poId) < 1) {
                showToast('Delivery can be recorded only for an accepted Purchase Order with outstanding quantity.', 'error');
                return;
            }
            selectedRecord = poId;
            currentModal = 'record_delivery';
            renderApp();
        }

        function acceptPurchaseOrder(poId) {
            const order = DB.orders.find(item => item.id === poId);
            if (DB.currentUser.role !== 'Supplier' || !order ||
                order.supplierId !== DB.currentUser.supplierId ||
                order.status !== 'Awaiting Supplier Signature') {
                showToast('This Purchase Order is not awaiting acceptance for your supplier account.', 'error');
                return;
            }
            if (!confirm(`By confirming, you accept and sign Purchase Order ${order.id} for ${order.quantity} ${order.itemTitle} at ₱${order.totalCost.toLocaleString()}.`)) return;

            order.status = 'Approved & Signed';
            order.signedBy = DB.currentUser.name;
            order.signedAt = new Date().toISOString();
            logAudit('PO Signed by Supplier', `Supplier ${order.supplierName} accepted Purchase Order ${order.id}.`);
            Storage.save(DB);
            showToast(`Purchase Order ${order.id} accepted and signed.`, 'success');
            renderApp();
        }

        function openInspectDeliveryModal(delId) {
            const delivery = DB.deliveries.find(item => item.id === delId);
            if (!hasPermission('record_delivery') || !delivery) {
                showToast('Only procurement staff can inspect a recorded delivery.', 'error');
                return;
            }
            selectedRecord = delId;
            currentModal = 'inspect_delivery';
            renderApp();

        function openScheduleMeetingModal(bidId) {
            const bid = DB.bids.find(item => item.id === bidId);

            if (!canManageBidding() || !bid || !need || bid.status !== 'Selected' ||
                need.selectedBidId !== bid.id) {
                showToast('Select a supplier before scheduling a proposal meeting.', 'error');
                return;
            }
            selectedRecord = bidId;
            currentModal = 'schedule_meeting';

        function selectBid(bidId) {
            const bid = DB.bids.find(item => item.id === bidId);
            const need = DB.stockNeeds.find(item => item.id === bid?.needId);
            const pr = DB.requisitions.find(item => item.id === need?.prId);
            if (!canManageBidding() || !bid || !need || !pr || pr.status !== 'Approved' ||
                need.status !== 'Published' || bid.status !== 'Submitted') {
                showToast('This supplier proposal cannot be selected for the current procurement need.', 'error');
                return;
            }

            DB.bids.filter(item => item.needId === need.id).forEach(item => {
                item.status = item.id === bid.id ? 'Selected' : 'Not Selected';
            });
            need.status = 'Supplier Selected';
            need.selectedBidId = bid.id;
            logAudit('Supplier Selected', `${bid.supplierName} selected for ${need.id} after proposal review.`);
            Storage.save(DB);
            showToast(`${bid.supplierName} selected. Schedule a proposal discussion next.`, 'success');
            renderApp();
        }

            const bid = DB.bids.find(item => item.id === bidId);
            const need = DB.stockNeeds.find(item => item.id === bid?.needId);
            const meeting = DB.proposalMeetings.find(item => item.bidId === bidId);
            if (!canManageBidding() || !bid || !need || need.selectedBidId !== bid.id ||

        function respondProposalMeeting(mtgId, responseStatus) {

            if (DB.currentUser.role === 'Supplier' && mtg &&
                mtg.supplierId === DB.currentUser.supplierId &&
                mtg.status === 'Pending Response' &&
                ['Agreed', 'Declined'].includes(responseStatus)) {
                mtg.status = responseStatus;
                logAudit('Meeting Response', `Supplier ${mtg.supplierName} responded ${responseStatus} to meeting invite ${mtgId}`);
                Storage.save(DB);
                showToast(`Meeting response sent: ${responseStatus}`, 'success');
                renderApp();
            } else {
                showToast('This meeting invite cannot be updated.', 'error');
            }
        }

        function approveAmendment(id) {
            const amd = DB.amendments.find(a => a.id === id);
            const po = DB.orders.find(order => order.id === amd?.poId);
            const delivery = DB.deliveries.find(item => item.id === amd?.delId && item.poId === amd?.poId);
            if (!canApproveAmendments() || !amd || amd.approvalStatus !== 'Supplier Responded' ||
                !po || !delivery || !Number.isInteger(amd.revisedQty) || amd.revisedQty < 1) {
                showToast('The amendment cannot be approved until a supplier response is available.', 'error');
                return;
            }

            const unitPrice = Number.isFinite(po.unitPrice) ? po.unitPrice : po.totalCost / po.quantity;
            amd.approvalStatus = 'Approved Amendment';
            po.quantity = amd.revisedQty;
            po.specs = amd.revisedSpecs;
            po.unitPrice = unitPrice;
            po.totalCost = unitPrice * amd.revisedQty;
            delivery.orderedQty = po.quantity;
            delivery.specs = po.specs;
            delivery.complianceStatus = 'Pending Inspection';
            delivery.remarks += ' | Amendment approved; re-inspection required after corrective action.';
            const payment = DB.payments.find(item => item.poId === amd.poId);
            if (payment) {
                payment.totalAmount = po.totalCost;
                payment.paymentAmount = po.totalCost;
                payment.deliveryVerified = false;
                payment.status = 'Pending';
            }
            logAudit('Amendment Approved', `Order amendment ${id} approved for ${amd.poId}; delivery re-inspection required.`);
            Storage.save(DB);
            showToast(`Amendment ${id} approved. Re-inspect the resolved delivery before payment.`, 'success');
            renderApp();
        }

        function rejectAmendment(id) {
            const amendment = DB.amendments.find(item => item.id === id);
            if (!canApproveAmendments() || !amendment || amendment.approvalStatus !== 'Supplier Responded') {
                showToast('Only a responded amendment can be rejected.', 'error');
                return;
            }
            amendment.approvalStatus = 'Rejected Amendment';
            logAudit('Amendment Rejected', `Order amendment ${id} rejected for ${amendment.poId}.`);
            Storage.save(DB);
            showToast(`Amendment ${id} rejected.`, 'warning');
            renderApp();
        }

        function respondToAmendment(id, response) {
            const amendment = DB.amendments.find(item => item.id === id);
            const order = DB.orders.find(item => item.id === amendment?.poId);
            if (DB.currentUser.role !== 'Supplier' || !amendment || !order ||
                order.supplierId !== DB.currentUser.supplierId ||
                amendment.approvalStatus !== 'Pending Supplier Response' || !response.trim()) {
                showToast('This amendment response cannot be submitted for your supplier account.', 'error');
                return false;
            }
            amendment.supplierResponse = response.trim();
            amendment.respondedAt = new Date().toISOString();
            amendment.approvalStatus = 'Supplier Responded';
            logAudit('Supplier Amendment Response', `Supplier responded to amendment ${id} for PO ${order.id}.`);
            Storage.save(DB);
            showToast('Supplier explanation submitted for review.', 'success');
            renderApp();
            return true;
        }

        async function approveUser(userId) {
            const u = DB.users.find(usr => usr.id === userId);
            if (u) {
                if (CLOUD_API_BASE) {
                    try {
                        await cloudRequest(`/users/${encodeURIComponent(u.id)}`, {
                            method: 'PUT',
                            body: JSON.stringify({ status: 'approved', appRole: u.role, accessRevoked: false })
                        });
                    } catch (error) {
                        showToast(error instanceof Error ? error.message : 'Account approval failed.', 'error');
                        return;
                    }
                }
                u.accessRevoked = false;
                u.status = 'Active';
                logAudit('User Authorized', `User ${u.name} (@${u.username}) approved by Administrator.`);
                Storage.save(DB);
                showToast('User account approved successfully.', 'success');
                renderApp();
            }
        }

        async function rejectUser(userId) {
            const u = DB.users.find(usr => usr.id === userId);
            if (!u) return;
            if (CLOUD_API_BASE) {
                try {
                    await cloudRequest(`/users/${encodeURIComponent(u.id)}`, {
                        method: 'PUT',
                        body: JSON.stringify({ status: 'rejected', appRole: u.role })
                    });
                } catch (error) {
                    showToast(error instanceof Error ? error.message : 'Account rejection failed.', 'error');
                    return;
                }
            }
            u.status = 'Rejected';
            logAudit('User Registration Rejected', `Administrator rejected ${u.name} (@${u.username}).`);
            Storage.save(DB);
            showToast('User registration rejected.', 'warning');
            renderApp();
        }

        async function revokeUser(userId) {
            const u = DB.users.find(usr => usr.id === userId);
            if (!u || u.role === 'Admin') return;
            if (!window.confirm(`Revoke access for ${u.name} (@${u.username})? They will be signed out and unable to sign in until access is restored.`)) return;
            if (CLOUD_API_BASE) {
                try {
                    await cloudRequest(`/users/${encodeURIComponent(u.id)}`, {
                        method: 'PUT',
                        body: JSON.stringify({
                            status: u.status === 'Rejected' ? 'rejected' : 'approved',
                            accessRevoked: true
                        })
                    });
                } catch (error) {
                    showToast(error instanceof Error ? error.message : 'Access revocation failed.', 'error');
                    return;
                }
            }
            u.accessRevoked = true;
            u.status = 'Access Revoked';
            logAudit('User Access Revoked', `Administrator revoked access for ${u.name} (@${u.username}).`);
            Storage.save(DB);
            showToast('User access revoked and active sessions invalidated.', 'success');
            renderApp();
        }

        async function deleteUserAccount(userId) {
            const u = DB.users.find(usr => usr.id === userId);
            if (!u || u.role === 'Admin') return;
            if (!window.confirm(`Permanently delete ${u.name} (@${u.username})? This removes the account and all active sessions. This cannot be undone.`)) return;
            if (CLOUD_API_BASE) {
                try {
                    await cloudRequest(`/users/${encodeURIComponent(u.id)}`, { method: 'DELETE' });
                } catch (error) {
                    showToast(error instanceof Error ? error.message : 'Account deletion failed.', 'error');
                    return;
                }
            }
            DB.users = DB.users.filter(account => account.id !== userId);
            logAudit('User Account Deleted', `Administrator permanently deleted ${u.name} (@${u.username}).`);
            Storage.save(DB);
            showToast('User account deleted.', 'success');
            renderApp();
        }

        async function updateUserRole(userId, newRole) {
            const u = DB.users.find(usr => usr.id === userId);
            if (u) {
                if (CLOUD_API_BASE) {
                    try {
                        await cloudRequest(`/users/${encodeURIComponent(u.id)}`, {
                            method: 'PUT',
                            body: JSON.stringify({
                                status: u.status === 'Pending Verification' ? 'pending' : u.status === 'Rejected' ? 'rejected' : 'approved',
                                appRole: newRole,
                                accessRevoked: u.accessRevoked || false
                            })
                        });
                    } catch (error) {
                        showToast(error instanceof Error ? error.message : 'User role update failed.', 'error');
                        renderApp();
                        return;
                    }
                }
                u.role = newRole;
                logAudit('User Role Updated', `User ${u.name} role changed to ${newRole}.`);
                Storage.save(DB);
                showToast(`User role updated to ${newRole}.`, 'info');
            }
        }

        async function saveAccessControlMatrix() {
            if (DB.currentUser?.role !== 'Admin') {
                showToast('Administrator access is required to manage permissions.', 'error');
                return;
            }
            const checkboxes = document.querySelectorAll('input[type="checkbox"][data-role]');
            const newPerms = {
                'Admin': [],
                'Procurement Head': [],
                'Procurement Officer': [],
                'Employee': [],
                'Supplier': []
            };

            checkboxes.forEach(cb => {
                const role = cb.getAttribute('data-role');
                const action = cb.getAttribute('data-action');
                if (cb.checked) {
                    if (!newPerms[role]) newPerms[role] = [];
                    newPerms[role].push(action);
                }
            });

            try {
                if (CLOUD_API_BASE) {
                    await cloudRequest('/access-control', {
                        method: 'PUT',
                        body: JSON.stringify({ permissions: newPerms })
                    });
                }
                DB.permissions = newPerms;
                DB.accessControl = Object.entries(newPerms).map(([role, permissions]) => ({ role, permissions }));
                logAudit('Permissions Updated', 'Access Control Matrix permissions updated by Admin.');
                await Storage.flush();
                showToast('Permissions Matrix successfully updated.', 'success');
                renderApp();
            } catch (error) {
                showToast(
                    error instanceof Error
                        ? `Could not save the permissions matrix: ${error.message}`
                        : 'Could not save the permissions matrix.',
                    'error'
                );
            }
        }

        function viewPRDetails(id) {
            const pr = DB.requisitions.find(r => r.id === id);
            if (pr) {
                showToast(`PR Details: ${pr.itemTitle} - Specs: ${pr.specs}`, 'info');
            }
        }

        // MAIN ATTACHED EVENT LISTENERS
        function attachMainEvents() {
            const logoutBtn = document.getElementById('logout-btn');
            if (logoutBtn) {
                logoutBtn.addEventListener('click', async () => {
                    const token = localStorage.getItem(CLOUD_TOKEN_KEY);
                    logAudit('User Logout', `User ${DB.currentUser.name} logged out.`);
                    try {
                        await Storage.flush();
                    } catch {
                        // The save failure is reported by Storage.save; continue signing out.
                    }
                    if (CLOUD_API_BASE && token) {
                        try {
                            await cloudRequest('/auth/logout', { method: 'POST' }, token);
                        } catch (error) {
                            console.error('Cloud sign-out could not invalidate the session.', error);
                            showToast('Could not invalidate the cloud session; it will expire automatically.', 'warning');
                        }
                        localStorage.removeItem(CLOUD_TOKEN_KEY);
                        localStorage.removeItem(CLOUD_USERNAME_KEY);
                    }
                    DB.currentUser = null;
                    Storage.save(DB);
                    renderApp();
                });
            }

            const resetBtn = document.getElementById('reset-db-btn');
            if (resetBtn) {
                resetBtn.addEventListener('click', async () => {
                    if (confirm('Permanently clear all procurement records and audit logs? The Admin account will remain.')) {
                        await Storage.reset();
                    }
                });
            }

            const navLinks = document.querySelectorAll('.nav-link');
            navLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    const tab = e.currentTarget.getAttribute('data-tab');
                    currentTab = tab;
                    renderApp();
                });
            });

            const quickCreatePr = document.getElementById('quick-create-pr-btn');
            if (quickCreatePr) {
                quickCreatePr.addEventListener('click', () => {
                    currentModal = 'create_pr';
                    renderApp();
                });
            }

            const openPrModalBtn = document.getElementById('open-create-pr-modal');
            if (openPrModalBtn) {
                openPrModalBtn.addEventListener('click', () => {
                    currentModal = 'create_pr';
                    renderApp();
                });
            }

            const needRequestSelect = document.getElementById('sn-pr-id');
            if (needRequestSelect) {
                needRequestSelect.addEventListener('change', () => {
                    const pr = getAvailableRequisitions().find(item => item.id === needRequestSelect.value);
                    document.getElementById('sn-title').value = pr?.itemTitle || '';
                    document.getElementById('sn-qty').value = pr?.quantity || '';
                    document.getElementById('sn-budget').value = pr?.totalCost || '';
                    document.getElementById('sn-specs').value = pr?.specs || '';
                });
            }

            // Star Rating Picker
            const starPicker = document.getElementById('star-picker');
            if (starPicker) {
                const stars = starPicker.querySelectorAll('i');
                const ratingInput = document.getElementById('rating-value');
                stars.forEach((star, idx) => {
                    star.addEventListener('click', () => {
                        const score = idx + 1;
                        ratingInput.value = score;
                        stars.forEach((s, i) => {
                            if (i < score) {
                                s.className = 'fa-solid fa-star text-amber-400';
                            } else {
                                s.className = 'fa-regular fa-star text-slate-300';
                            }
                        });
                    });
                });
            }

            document.querySelectorAll('form[data-amendment-response-form]').forEach(form => {
                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const amendmentId = form.getAttribute('data-amendment-response-form');
                    const response = form.querySelector('[data-amendment-response]').value;
                    respondToAmendment(amendmentId, response);
                });
            });

            // Forms Submit Events
            const createPrForm = document.getElementById('create-pr-form');
            if (createPrForm) {
                createPrForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const title = document.getElementById('pr-title').value.trim();
                    const specs = document.getElementById('pr-specs').value.trim();
                    const qty = parseInt(document.getElementById('pr-qty').value);
                    const price = parseFloat(document.getElementById('pr-price').value);
                    const targetDate = document.getElementById('pr-date').value;
                    const remarks = document.getElementById('pr-remarks').value.trim();

                    const newPR = {
                        id: 'PR-' + (1000 + DB.requisitions.length + 1),
                        department: DB.currentUser.department,
                        itemTitle: title,
                        specs: specs,
                        targetDate: targetDate,
                        unitPrice: price,
                        quantity: qty,
                        totalCost: qty * price,
                        status: 'Pending',
                        requestedBy: DB.currentUser.name,
                        requestedByUsername: DB.currentUser.username,
                        createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16),
                        remarks: remarks
                    };

                    DB.requisitions.unshift(newPR);
                    logAudit('PR Created', `Requisition ${newPR.id} created for ${title}.`);
                    Storage.save(DB);
                    showToast(`Requisition ${newPR.id} created successfully!`, 'success');
                    closeModal();
                });
            }

            const recordDeliveryForm = document.getElementById('record-delivery-form');
            if (recordDeliveryForm) {
                recordDeliveryForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const order = DB.orders.find(o => o.id === selectedRecord);
                    const qtyDelivered = parseInt(document.getElementById('del-qty').value);
                    const delDate = document.getElementById('del-date').value;
                    const notes = document.getElementById('del-notes').value.trim();
                    const remainingQty = getRemainingOrderQuantity(order?.id);

                    if (hasPermission('record_delivery') && order &&
                        ['Approved & Signed', 'Issued'].includes(order.status) &&
                        Number.isInteger(qtyDelivered) && qtyDelivered > 0 && qtyDelivered <= remainingQty && delDate) {
                        const newDel = {
                            id: 'DEL-' + (8000 + DB.deliveries.length + 1),
                            poId: order.id,
                            prId: order.prId,
                            supplierName: order.supplierName,
                            department: order.department,
                            itemTitle: order.itemTitle,
                            specs: order.specs,
                            orderedQty: order.quantity,
                            deliveredQty: qtyDelivered,
                            expectedDate: delDate,
                            actualDate: delDate,
                            deliveryStatus: qtyDelivered === remainingQty ? 'Delivered' : 'Partial',
                            complianceStatus: 'Pending Inspection',
                            remarks: notes,
                            recordedBy: DB.currentUser.name,
                            updatedAt: new Date().toISOString().replace('T', ' ').substring(0, 16)
                        };

                        DB.deliveries.unshift(newDel);
                        const payment = DB.payments.find(item => item.poId === order.id);
                        if (payment) payment.deliveryVerified = false;
                        logAudit('Delivery Recorded', `Shipment recorded for PO ${order.id}. Qty: ${qtyDelivered}`);
                        Storage.save(DB);
                        showToast(`Delivery logged for ${order.id}.`, 'success');
                        closeModal();
                    } else {
                        showToast('Delivery could not be recorded. Verify PO acceptance and remaining ordered quantity.', 'error');
                    }
                });
            }

            const inspectDeliveryForm = document.getElementById('inspect-delivery-form');
            if (inspectDeliveryForm) {
                inspectDeliveryForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const delivery = DB.deliveries.find(d => d.id === selectedRecord);
                    const inspectStatus = document.getElementById('inspect-status').value;
                    const remarks = document.getElementById('inspect-remarks').value.trim();

                    if (delivery) {
                        delivery.complianceStatus = inspectStatus;
                        delivery.remarks += ` | Inspection: ${remarks}`;

                        const payment = DB.payments.find(p => p.poId === delivery.poId);
                        if (payment) payment.deliveryVerified = isOrderFullyVerified(delivery.poId);

                        logAudit('Delivery Inspected', `Delivery ${delivery.id} marked as ${inspectStatus}`);
                        Storage.save(DB);
                        showToast(`Inspection outcome logged successfully!`, 'success');
                        closeModal();
                    } else {
                        showToast('The delivery record could not be found.', 'error');
                    }
                });
            }

            const rateSupplierForm = document.getElementById('rate-supplier-form');
            if (rateSupplierForm) {
                rateSupplierForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const ratingVal = parseInt(document.getElementById('rating-value').value);
                    const qScore = parseInt(document.getElementById('score-quality').value);
                    const dScore = parseInt(document.getElementById('score-delivery').value);
                    const pScore = parseInt(document.getElementById('score-pricing').value);
                    const feedback = document.getElementById('rating-feedback').value.trim();
                    const supplierId = typeof selectedRecord === 'object' ? selectedRecord.supplierId : null;
                    const poId = typeof selectedRecord === 'object' ? selectedRecord.poId : null;
                    const payment = DB.payments.find(item => item.poId === poId);
                    const order = DB.orders.find(item => item.id === poId && item.supplierId === supplierId);

                    if (!hasPermission('rate_supplier') || !payment || payment.status !== 'Paid' || !order ||
                        !isOrderFullyVerified(poId) || DB.ratings.some(item => item.poId === poId) ||
                        !Number.isInteger(ratingVal) || ratingVal < 1 || ratingVal > 5 ||
                        !Number.isInteger(qScore) || qScore < 1 || qScore > 5 ||
                        !Number.isInteger(dScore) || dScore < 1 || dScore > 5 ||
                        !Number.isInteger(pScore) || pScore < 1 || pScore > 5 || !feedback) {
                        showToast('A valid evaluation can be submitted only for a completed and paid transaction.', 'error');
                        return;
                    }
                    const newRating = {
                        id: 'rat-' + Date.now(),
                        supplierId,
                        poId,
                        evaluatorName: DB.currentUser.name,
                        evaluatorRole: DB.currentUser.role,
                        rating: ratingVal,
                        qualityScore: qScore,
                        deliveryScore: dScore,
                        pricingScore: pScore,
                        feedback: feedback,
                        createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16)
                    };

                    DB.ratings.unshift(newRating);
                    logAudit('Supplier Evaluated', `Rating submitted for supplier ${supplierId} after transaction ${poId}.`);
                    Storage.save(DB);
                    showToast('Supplier evaluation recorded.', 'success');
                    closeModal();
                });
            }

            const addSupplierForm = document.getElementById('add-supplier-form');
            if (addSupplierForm) {
                addSupplierForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const name = document.getElementById('sup-name').value.trim();
                    const contact = document.getElementById('sup-contact').value.trim();
                    const email = document.getElementById('sup-email').value.trim();
                    const phone = document.getElementById('sup-phone').value.trim();
                    const category = document.getElementById('sup-category').value.trim();

                    const newSup = {
                        id: 'sup-' + Date.now(),
                        name,
                        contact,
                        email,
                        phone,
                        category
                    };

                    DB.suppliers.push(newSup);
                    logAudit('Supplier Added', `Vendor ${name} registered into vendor system.`);
                    Storage.save(DB);
                    showToast(`Supplier ${name} added successfully!`, 'success');
                    closeModal();
                });
            }

            const processPaymentForm = document.getElementById('process-payment-form');
            if (processPaymentForm) {
                processPaymentForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const payment = DB.payments.find(p => p.id === selectedRecord);
                    const method = document.getElementById('pay-method').value;
                    const ref = document.getElementById('pay-ref').value.trim();

                    if (hasPermission('process_payment') && payment && payment.status === 'Pending' &&
                        isOrderFullyVerified(payment.poId) && method && ref) {
                        payment.paymentMethod = method;
                        payment.refNumber = ref;
                        payment.status = 'Paid';
                        payment.paymentDate = new Date().toISOString().substring(0, 10);
                        payment.processedBy = DB.currentUser.name;

                        logAudit('Disbursement Completed', `Payment ${payment.id} processed via ${method}. Ref: ${ref}`);
                        Storage.save(DB);
                        showToast(`Disbursement of ₱${payment.paymentAmount.toLocaleString()} confirmed!`, 'success');
                        closeModal();
                    } else {
                        showToast('Payment is blocked until every item is received and verified.', 'error');
                    }
                });
            }

            const initiateAmendmentForm = document.getElementById('initiate-amendment-form');
            if (initiateAmendmentForm) {
                initiateAmendmentForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const reason = document.getElementById('amend-reason').value.trim();
                    const qty = parseInt(document.getElementById('amend-qty').value);
                    const specs = document.getElementById('amend-specs').value.trim();
                    const order = DB.orders.find(item => item.id === selectedRecord.poId);
                    const delivery = DB.deliveries.find(item => item.id === selectedRecord.delId && item.poId === selectedRecord.poId);

                    if (!canManageDeliveryIssues() || !order || !delivery ||
                        !Number.isInteger(qty) || qty < 1 || !reason || !specs) {
                        showToast('Amendment details are invalid or the delivery issue is no longer actionable.', 'error');
                        return;
                    }
                    const newAmd = {
                        id: 'AMD-' + (3000 + DB.amendments.length + 1),
                        poId: selectedRecord.poId,
                        delId: selectedRecord.delId,
                        supplierId: order.supplierId,
                        supplierName: order.supplierName,
                        reason: reason,
                        revisedQty: qty,
                        revisedSpecs: specs,
                        approvalStatus: 'Pending Supplier Response',
                        requestedBy: DB.currentUser.name
                    };

                    DB.amendments.unshift(newAmd);
                    logAudit('Amendment Issued', `Amendment ${newAmd.id} issued to ${order.supplierName} for PO ${selectedRecord.poId}.`);
                    Storage.save(DB);
                    showToast('Order amendment issued; awaiting the supplier explanation.', 'success');
                    closeModal();
                });
            }

            const createStockNeedForm = document.getElementById('create-stock-need-form');
            if (createStockNeedForm) {
                createStockNeedForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const prId = document.getElementById('sn-pr-id').value;
                    const pr = getAvailableRequisitions().find(item => item.id === prId);
                    const title = document.getElementById('sn-title').value.trim();
                    const targetQty = parseInt(document.getElementById('sn-qty').value);
                    const budgetCap = parseFloat(document.getElementById('sn-budget').value);
                    const techSpecs = document.getElementById('sn-specs').value.trim();

                    if (!canManageBidding() || !pr || !title || !techSpecs ||
                        !Number.isInteger(targetQty) || targetQty < 1 ||
                        !Number.isFinite(budgetCap) || budgetCap < 0) {
                        showToast('A published need must be based on an approved request with valid details.', 'error');
                        return;
                    }

                    const newNeed = {
                        id: 'SN-' + (2000 + DB.stockNeeds.length + 1),
                        prId: pr.id,
                        title,
                        targetQty,
                        budgetCap,
                        techSpecs,
                        status: 'Published',
                        createdBy: DB.currentUser.name,
                        createdAt: new Date().toISOString().replace('T', ' ').substring(0, 16)
                    };

                    DB.stockNeeds.unshift(newNeed);
                    logAudit('Stock Need Published', `Stock Need ${newNeed.id} published by ${DB.currentUser.name}`);
                    Storage.save(DB);
                    showToast(`Stock Need ${newNeed.id} published for bidding!`, 'success');
                    closeModal();
                });
            }

            const submitBidForm = document.getElementById('submit-bid-form');
            if (submitBidForm) {
                submitBidForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const need = DB.stockNeeds.find(s => s.id === selectedRecord);
                    const supplier = DB.suppliers.find(s => s.id === DB.currentUser.supplierId);
                    const unitPrice = parseFloat(document.getElementById('bid-unit-price').value);
                    const leadTimeDays = parseInt(document.getElementById('bid-lead-time').value);
                    const notes = document.getElementById('bid-notes').value.trim();

                    if (DB.currentUser.role === 'Supplier' && need?.status === 'Published' && supplier &&
                        !DB.bids.some(item => item.needId === need.id && item.supplierId === supplier.id) &&
                        Number.isFinite(unitPrice) && unitPrice >= 0 && Number.isInteger(leadTimeDays) && leadTimeDays > 0) {
                        const newBid = {
                            id: 'BID-' + (3000 + DB.bids.length + 1),
                            needId: need.id,
                            supplierId: supplier.id,
                            supplierName: supplier.name,
                            unitPrice,
                            totalCost: unitPrice * need.targetQty,
                            leadTimeDays,
                            notes,
                            submittedAt: new Date().toISOString().replace('T', ' ').substring(0, 16),
                            status: 'Submitted'
                        };

                        DB.bids.unshift(newBid);
                        logAudit('Bid Submitted', `Supplier ${supplier.name} submitted bid for ${need.id}`);
                        Storage.save(DB);
                        showToast(`Bid submitted successfully for ${need.title}!`, 'success');
                        closeModal();
                    } else {
                        showToast('The bid could not be submitted. Verify the need is open and proposal details are valid.', 'error');
                    }
                });
            }

            const scheduleMeetingForm = document.getElementById('schedule-meeting-form');
            if (scheduleMeetingForm) {
                scheduleMeetingForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const bid = DB.bids.find(b => b.id === selectedRecord);
                    const date = document.getElementById('mtg-date').value;
                    const time = document.getElementById('mtg-time').value;
                    const meetingMode = document.getElementById('mtg-mode').value;
                    const venue = document.getElementById('mtg-venue').value.trim();
                    const notes = document.getElementById('mtg-notes').value.trim();

                    const need = DB.stockNeeds.find(item => item.id === bid?.needId);
                    const latestMeeting = DB.proposalMeetings.find(item => item.bidId === bid?.id);
                    if (canManageBidding() && bid?.status === 'Selected' && need?.selectedBidId === bid.id &&
                        ['Supplier Selected', 'Published'].includes(need.status) &&
                        !['Pending Response', 'Agreed'].includes(latestMeeting?.status) &&
                        date && time && meetingMode && venue) {
                        const newMtg = {
                            id: 'MTG-' + (4000 + DB.proposalMeetings.length + 1),
                            needId: bid.needId,
                            bidId: bid.id,
                            supplierId: bid.supplierId,
                            supplierName: bid.supplierName,
                            date,
                            time,
                            meetingMode,
                            venue,
                            status: 'Pending Response',
                            notes
                        };

                        DB.proposalMeetings.unshift(newMtg);
                        logAudit('Proposal Meeting Scheduled', `Meeting ${newMtg.id} scheduled with ${bid.supplierName}`);
                        Storage.save(DB);
                        showToast(`Proposal meeting scheduled with ${bid.supplierName}!`, 'success');
                        closeModal();
                    } else {
                        showToast('The proposal meeting could not be scheduled. Verify supplier selection and meeting details.', 'error');
                    }
                });
            }

            const finalizeAgreementForm = document.getElementById('finalize-agreement-form');
            if (finalizeAgreementForm) {
                finalizeAgreementForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const bid = DB.bids.find(item => item.id === selectedRecord);
                    const need = DB.stockNeeds.find(item => item.id === bid?.needId);
                    const pr = DB.requisitions.find(item => item.id === need?.prId);
                    const meeting = DB.proposalMeetings.find(item => item.bidId === bid?.id);
                    const unitPrice = Number(document.getElementById('agreement-unit-price').value);
                    const quantity = Number(document.getElementById('agreement-quantity').value);
                    const specs = document.getElementById('agreement-specs').value.trim();
                    const terms = document.getElementById('agreement-terms').value.trim();

                    if (!canManageBidding() || !bid || !need || !pr || pr.status !== 'Approved' ||
                        need.selectedBidId !== bid.id || need.status !== 'Supplier Selected' ||
                        bid.status !== 'Selected' || meeting?.status !== 'Agreed' ||
                        !Number.isFinite(unitPrice) || unitPrice < 0 ||
                        !Number.isInteger(quantity) || quantity < 1 || !specs || !terms) {
                        showToast('The agreement could not be finalized. Verify the selected supplier, meeting, and terms.', 'error');
                        return;
                    }

                    const newPO = {
                        id: 'PO-' + (5000 + DB.orders.length + 1),
                        prId: pr.id,
                        needId: need.id,
                        bidId: bid.id,
                        supplierId: bid.supplierId,
                        supplierName: bid.supplierName,
                        department: pr.department,
                        itemTitle: need.title,
                        specs,
                        quantity,
                        unitPrice,
                        totalCost: quantity * unitPrice,
                        agreedTerms: terms,
                        poDate: new Date().toISOString().substring(0, 10),
                        status: 'Awaiting Supplier Signature',
                        type: 'Purchase Order',
                        createdByName: DB.currentUser.name
                    };

                    need.status = 'Awarded';
                    pr.status = 'In Process';
                    DB.orders.unshift(newPO);
                    DB.payments.unshift({
                        id: 'PAY-' + (9000 + DB.payments.length + 1),
                        poId: newPO.id,
                        supplierName: bid.supplierName,
                        department: pr.department,
                        totalAmount: newPO.totalCost,
                        deliveryVerified: false,
                        paymentAmount: newPO.totalCost,
                        paymentMethod: '',
                        paymentDate: '',
                        status: 'Pending',
                        refNumber: '',
                        remarks: 'Awaiting supplier signature, delivery, and inspection.'
                    });

                    logAudit('PO Issued', `Purchase Order ${newPO.id} issued to selected supplier ${bid.supplierName}; awaiting supplier signature.`);
                    Storage.save(DB);
                    showToast(`Purchase Order ${newPO.id} issued for supplier signature.`, 'success');
                    closeModal();
                });
            }
        }

        // ==========================================
        // INITIALIZE SYSTEM APPLICATION
        // ==========================================
        window.onload = async function() {
            window.authMode = 'login';
            if (CLOUD_API_BASE) {
                await restoreCloudSession();
            } else {
                renderApp();
            }
        };
    </script>
</body>
</html>
