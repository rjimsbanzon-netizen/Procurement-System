# Cloudflare Worker + D1 binding for ProcureCorp
# Docs: https://developers.cloudflare.com/d1/

name = "procurecorp-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Create DB first:
#   npx wrangler d1 create procurecorp-db
# Then paste the database_id below.

[[d1_databases]]
binding = "DB"
database_name = "procurecorp-db"
database_id = "1dca6a5f-bc28-46c6-9ac2-8cec53f9b882"

[vars]
# Comma-separated frontend origins; use the hostname origin, without a path.
ALLOWED_ORIGIN = "https://rjimsbanzon-netizen.github.io,http://localhost:5173,http://127.0.0.1:5173"
