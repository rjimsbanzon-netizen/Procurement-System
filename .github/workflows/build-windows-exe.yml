name: Build ProcureFlow Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer and portable EXE
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Test desktop URL security
        working-directory: desktop
        run: npm test

      - name: Build EXE files
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Upload Windows EXE files
        uses: actions/upload-artifact@v4
        with:
          name: ProcureFlow-Windows-x64
          path: desktop-dist/*.exe
          if-no-files-found: error
          retention-days: 30
